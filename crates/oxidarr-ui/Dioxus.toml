[application]
name = "oxidarr-ui"
# No `out_dir` here on purpose. `dx build` (dioxus-cli 0.7.10) does not read
# it for a web build anyway — it always writes to
# `<workspace>/target/dx/oxidarr-ui/<release|debug>/web/public` regardless
# (that field is only consulted by the separate `dx bundle` subcommand,
# which this repo doesn't use, and even then nests the result one level
# deeper, under `<out_dir>/public`). It used to be set to `"dist"` as
# documentation of the intended destination, back when that destination was
# this crate's own `crates/oxidarr-ui/dist`; it is now
# `crates/oxidarr-prowl/dist` — a different crate entirely, which `out_dir`
# (resolved relative to this file) cannot express. Setting it to anything
# here would either be wrong (the old path) or misleading (a bare "dist"
# that looks self-referential but actually names a sibling crate).
# `scripts/build-ui.sh` copies `dx build`'s real output straight to
# `crates/oxidarr-prowl/dist` — the directory `oxidarr-prowl`'s `ui` feature
# embeds at compile time (see `crates/oxidarr-prowl/src/ui.rs`) — so no
# setting here does anything useful either way.

[web.app]
title = "Oxidarr"
