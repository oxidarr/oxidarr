[package]
name = "oxidarr-prowl"
description = "Prowlarr-compatible indexer manager, in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "oxidarr_prowl"
path = "src/lib.rs"

[[bin]]
name = "oxidarr-prowl"
path = "src/main.rs"

[dependencies]
oxidarr-core = { workspace = true }
oxidarr-cardigann = { workspace = true }
oxidarr-db = { workspace = true }
oxidarr-http = { workspace = true }
oxidarr-indexer = { workspace = true }
axum = { workspace = true }
quick-xml = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
include_dir = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "signal", "rt-multi-thread", "time", "net", "io-util"] }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }

[features]
# Embeds and serves the `oxidarr-ui` web bundle at `/` — see
# `src/ui.rs`'s module docs. Off by default: no test outside this feature
# needs a wasm toolchain or crates/oxidarr-ui/dist at all. Enabling it is a
# hard prerequisite, not an option — `crates/oxidarr-ui/dist` must already
# exist (run `./scripts/build-ui.sh` first; see README.md's "Web UI"
# section) or the build fails, caught early with an actionable message by
# `build.rs`, or otherwise later by `include_dir!`'s own much less clear
# panic.
ui = ["dep:include_dir"]

[lints]
workspace = true
