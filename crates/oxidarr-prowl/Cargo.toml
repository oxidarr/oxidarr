[package]
name = "oxidarr-prowl"
description = "Prowlarr-compatible indexer manager, in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "oxidarr_prowl"
path = "src/lib.rs"

[[bin]]
name = "oxidarr-prowl"
path = "src/main.rs"

[dependencies]
oxidarr-core = { workspace = true }
oxidarr-cardigann = { workspace = true }
oxidarr-db = { workspace = true }
oxidarr-http = { workspace = true }
oxidarr-indexer = { workspace = true }
axum = { workspace = true }
quick-xml = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "signal", "rt-multi-thread"] }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
