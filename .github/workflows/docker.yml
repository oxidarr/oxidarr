name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sanitise platform for artifact naming
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Pull requests build to prove the Dockerfile works, but must not
      # push: a fork's PR has no credentials, and an untrusted build must
      # never reach the registry.
      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, locally, under a throwaway tag so the runtime contract
      # below can exercise the exact image before anything is pushed.
      - name: Build (local, for verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: oxidarr-prowl:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The spec's runtime contract: the four properties that were deferred
      # as "check before the image is ever published". This is the only
      # place that checks them before `:main` is pushed.
      #   1. /ping answers once the container is up.
      #   2. The container runs as uid 10001, not root.
      #   3. /data/definitions does not exist in the image — definitions
      #      are fetched at runtime, never baked in.
      #   4. No layer in the image's history mentions "definitions" —
      #      guards the third-party/unlicensed constraint even against a
      #      leftover intermediate layer, not just the final filesystem.
      - name: Verify the runtime contract
        run: |
          set -euo pipefail
          docker run --rm -d --name verify -p 9696:9696 \
            -e OXIDARR_EXTERNAL_URL=http://127.0.0.1:9696 oxidarr-prowl:ci
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:9696/ping && break; sleep 1; done
          curl -fsS http://127.0.0.1:9696/ping
          test "$(docker exec verify id -u)" = 10001
          if docker run --rm --entrypoint test oxidarr-prowl:ci -d /data/definitions; then
            echo "FAIL: /data/definitions exists in the image — definitions must never be baked into a layer" >&2
            exit 1
          fi
          if docker history --no-trunc oxidarr-prowl:ci | grep -qi definitions; then
            echo "FAIL: docker history mentions 'definitions' — some layer must have baked in the third-party definitions" >&2
            exit 1
          fi
          docker rm -f verify

      # Digest-only output: with two legs building the same tags, whichever
      # pushed last would silently overwrite the other's single-arch image
      # under `:main`. Pushing by digest instead and merging both into one
      # manifest list (the `merge` job below) is what makes `:main` a real
      # multi-arch tag.
      - name: Build and push by digest
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/oxidarr/oxidarr-prowl,push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ steps.platform.outputs.slug }}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      # This is the only place a tag is attached to the image, and the only
      # place the full tag set is derived — see the comment on "Create and
      # push the multi-arch manifest" below for why it lives here rather
      # than on the build legs.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oxidarr/oxidarr-prowl
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Semver prereleases are always hyphen-suffixed (e.g. v0.0.1-rc1),
            # so excluding hyphenated refs keeps `latest` off release
            # candidates without needing full semver parsing here.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      # Each leg pushed its image by digest only, with no tag. This is the
      # one place a tag is attached, and it is attached to a manifest list
      # spanning both digests, so every tag `metadata-action` derived above
      # always resolves to a genuine multi-arch image rather than whichever
      # leg pushed last.
      #
      # `imagetools create` wants tags as repeated `-t` flags, but
      # `steps.meta.outputs.tags` is a newline-separated string — splitting
      # that naively (e.g. word-splitting on whitespace) would mangle it.
      # `metadata-action` also sets `DOCKER_METADATA_OUTPUT_JSON` for
      # exactly this situation: its `.tags` array can be turned into `-t`
      # flags with `jq`, which is what this step does.
      - name: Create and push the multi-arch manifest
        run: |
          set -euo pipefail
          cd /tmp/digests
          digests=$(for f in *; do printf 'ghcr.io/oxidarr/oxidarr-prowl@%s ' "$(cat "$f")"; done)
          tags=$(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $digests
